server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: digital-wallet-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  security:
    jwt:
      # Base64-encoded HMAC key (>= 256 bits). Override JWT_SECRET in every non-local environment.
      secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Njc4OTA=}
      issuer: digital-wallet-api
      expiration: ${JWT_EXPIRATION:1h}
  idempotency:
    retention: 24h
    cleanup-cron: "0 0 * * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
